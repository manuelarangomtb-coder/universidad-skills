\"\u003e2\u003c/text\u003e\n\u003ctext x=\"65\" y=\"337\" font-size=\"16\"\u003en = 40 · Δx = 0,05 · suma ≈ 2,7675\u003c/text\u003e\n\u003c/g\u003e\u003c/svg\u003e"}], "intro": "Explora f(x) = x² en [0, 2]. La línea verde es la curva y las piezas claras son rectángulos con extremos derechos. La unidad horizontal y la vertical son unidades de longitud (u); el área se expresa en u².", "question": "Al aumentar n, ¿se acercan las áreas aproximadas a 8/3? Observa también cómo se reduce el exceso de los rectángulos.", "title": "¿Y si usamos más rectángulos?"}, "subtitle": "Cómo pequeñas áreas nos ayudan a entender una curva. Descubre la idea, juega con ella y construye confianza a tu ritmo.", "takeaway": "Divide el intervalo, elige una altura en cada parte, multiplica altura por ancho y suma los aportes.", "title": "Sumas de Riemann", "training": [{"prompt": "f(x) = 3 en [0, 4]. Usamos 2 rectángulos iguales. ¿Cuál es la suma?", "steps": [{"calculation": "Δx = (b − a) / n = (4 − 0) / 2 = 2", "correct": 0, "explanation": "El símbolo Δx se lee ‘delta equis’ y representa el ancho de cada rectángulo.", "feedback": ["Sí: repartes la longitud total entre el número de partes.", "Ese ancho es el doble del necesario. Divide la longitud total entre n.", "Ese ancho es demasiado grande. Comprueba que n anchos cubran exactamente el intervalo."], "options": ["2", "4", "6"], "prompt": "Dividimos [0, 4] en 2 partes iguales. ¿Cuánto mide Δx?", "title": "Primero, el ancho"}, {"calculation": "f(0) = f(2) = f(4) = 3", "correct": 1, "explanation": "Para obtener una altura evaluamos la función. Como siempre devuelve 3, ambos rectángulos tienen altura 3.", "feedback": ["2 es el ancho, que ya calculamos.", "Exacto: una función constante vale 3 en todos los puntos.", "4 es el extremo del intervalo; la altura la da f(x)."], "options": ["2", "3", "4"], "prompt": "Si f(x) = 3, ¿cuánto mide la altura de cada rectángulo?", "title": "La altura no cambia"}, {"calculation": "S = 3 × 2 + 3 × 2 = 12 u²", "correct": 2, "explanation": "Cada área es 2 × 3 = 6. Al sumar dos áreas de 6 obtenemos 12 unidades cuadradas. Aquí la suma es exacta porque la función es constante.", "feedback": ["6 corresponde a un solo rectángulo; faltan los dos.", "Multiplica base por altura antes de sumar los rectángulos.", "Sí: 6 + 6 = 12."], "options": ["6", "8", "12"], "prompt": "Cada rectángulo tiene base 2 y altura 3. Hay dos. ¿Área total?", "title": "Sumamos áreas pequeñas"}], "title": "Un área que ya conoces"}, {"prompt": "f(x) = x en [0, 2]. Tomamos 2 rectángulos y sus extremos derechos.", "steps": [{"calculation": "Δx = (b − a) / n = (2 − 0) / 2 = 1", "correct": 0, "explanation": "El símbolo Δx se lee ‘delta equis’ y representa el ancho de cada rectángulo.", "feedback": ["Sí: repartes la longitud total entre el número de partes.", "Ese ancho es el doble del necesario. Divide la longitud total entre n.", "Ese ancho es demasiado grande. Comprueba que n anchos cubran exactamente el intervalo."], "options": ["1", "2", "3"], "prompt": "Dividimos [0, 2] en 2 partes iguales. ¿Cuánto mide Δx?", "title": "Primero, el ancho"}, {"calculation": "x₁ = 1; x₂ = 2 → f(1) = 1; f(2) = 2", "correct": 1, "explanation": "El extremo derecho de [0, 1] es 1 y el de [1, 2] es 2. Como f(x) = x, esas también son las alturas.", "feedback": ["Son los extremos izquierdos. Busca el final de cada intervalo.", "Sí: tomamos el final de cada intervalo.", "Esos son los puntos medios; aquí pedimos los derechos."], "options": ["0 y 1", "1 y 2", "0,5 y 1,5"], "prompt": "Los intervalos son [0, 1] y [1, 2]. ¿Qué extremos derechos usamos?", "title": "Elegimos dónde medir"}, {"calculation": "S = 1 × 1 + 2 × 1 = 3 u²; área exacta = (2 × 2)/2 = 2 u²", "correct": 0, "explanation": "Sumamos las áreas, no solo contamos rectángulos. La suma derecha da 3 u²; el área exacta del triángulo bajo la recta es 2 u². Aquí aproximación y área exacta son distintas.", "feedback": ["Correcto: (1 + 2) × 1 = 3.", "2 es el área exacta bajo esta recta; la suma pedida usa rectángulos derechos.", "No todas las alturas valen 2; usa una altura por intervalo."], "options": ["3", "2", "4"], "prompt": "Las alturas son 1 y 2, y el ancho es 1. ¿Cuál es la suma?", "title": "Altura por ancho, y sumamos"}], "title": "Una altura que va cambiando"}, {"prompt": "Una persona camina con velocidad v(t) = t + 1 m/s entre 0 y 4 s. Usamos 2 intervalos y puntos medios.", "steps": [{"calculation": "Δx = (b − a) / n = (4 − 0) / 2 = 2", "correct": 0, "explanation": "El símbolo Δx se lee ‘delta equis’ y representa el ancho de cada rectángulo.", "feedback": ["Sí: repartes la longitud total entre el número de partes.", "Ese ancho es el doble del necesario. Divide la longitud total entre n.", "Ese ancho es demasiado grande. Comprueba que n anchos cubran exactamente el intervalo."], "options": ["2", "4", "6"], "prompt": "Dividimos [0, 4] en 2 partes iguales. ¿Cuánto mide Δx?", "title": "Primero, el ancho"}, {"calculation": "t* = 1 s y 3 s → v(1) = 2 m/s; v(3) = 4 m/s", "correct": 2, "explanation": "Cada tiempo medio está en mitad de su intervalo. Evaluamos v(1) = 2 y v(3) = 4. El ancho aquí representa 2 segundos.", "feedback": ["1 y 3 son los tiempos medios; falta sumar 1 para obtener la velocidad.", "Son velocidades en los extremos derechos, t = 2 y t = 4.", "Sí: en t = 1, v = 2; en t = 3, v = 4."], "options": ["1 y 3 m/s", "3 y 5 m/s", "2 y 4 m/s"], "prompt": "Los intervalos son [0, 2] y [2, 4]. ¿Qué velocidades hay en sus puntos medios?", "title": "Miramos en mitad de cada tramo"}, {"calculation": "Distancia = 2 × 2 + 4 × 2 = 4 + 8 = 12 m", "correct": 1, "explanation": "Multiplicamos cada velocidad por su duración y sumamos. Las unidades (m/s) × s dan metros. La regla del punto medio es exacta en este ejemplo porque v(t) es lineal.", "feedback": ["6 es la suma de velocidades; falta multiplicar por los 2 segundos.", "Bien: 2 × 2 + 4 × 2 = 12 metros.", "Has usado solo una de las dos velocidades para ambos intervalos."], "options": ["6 m", " try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(saved.records?.length===10&&saved.guides?.length===3&&saved.helpGuides?.length===10&&saved.trained?.length===3)S=saved;}localStorage.setItem(KEY,JSON.stringify(S));}catch{storageOK=false;}
function save(){if(storageOK){try{localStorage.setItem(KEY,JSON.stringify(S));}catch{storageOK=false;}}$('storage-warning').hidden=storageOK;$('save-status').textContent=storageOK?'Progreso guardado en este dispositivo':'Progreso disponible mientras mantengas esta página abierta';}
function announce(message){$('announcer').textContent=message;}
const allTrained=()=>S.trained.every(Boolean);
const evaluated=()=>S.records.filter(r=>r.first!==null).length;
function figure(svg,alt,cls='diagram'){return `<div class="${cls}" role="img" aria-label="${esc(alt)}">${svg}</div>`;}
function formula(value){return value?`<div class="formula">${esc(value)}</div>`:'';}
function stop(){if(timer!==null){clearInterval(timer);timer=null;}if($('play'))$('play').textContent='Reproducir cambios ▶';}
function navigate(section){if(section==='quiz'&&!allTrained()){announce('Primero terminemos los tres ejemplos guiados.');return;}stop();S.section=section;save();render();$('main').focus();}
function renderNav(){const names=[['discover','Descubre'],['explore','Explora'],['train','Entrena'],['quiz','Practica']];$('nav').innerHTML=names.map(([id,name],i)=>`<button class="tab ${S.section===id?'active':''}" data-section="${id}" ${id==='quiz'&&!allTrained()?'disabled title="Completa los tres ejemplos guiados"':''} ${S.section===id?'aria-current="step"':''}><span class="number">0${i+1}</span>${name}${id==='quiz'?' · 10':''}</button>`).join('');}
function render(){document.title=L.title+' · Aprender cálculo';renderNav();const fn={discover:discover,explore:explore,train:train,quiz:quiz,results:results}[S.section]||discover;$('main').innerHTML=fn();save();if(S.section==='explore')updateFrame();}
function discover(){return `<section class="hero"><div class="hero-copy"><span class="pill"><span class="dot"></span>Una pequeña idea. Muchas posibilidades.</span><h1>${esc(L.title)}</h1><p class="lead">${esc(L.subtitle)}</p><div><button class="primary" data-action="start-discover">Comenzar a descubrir ↓</button></div></div>${figure(L.tutorial[0].svg,L.tutorial[0].alt,'hero-visual')}</section><section id="tutorial"><div class="section-head"><div><p class="eyebrow">Tu punto de partida</p><h2>Vamos a hacerlo sencillo.</h2></div></div><p class="lead">${esc(L.objective)}</p><div class="note small"><strong>Antes de empezar.</strong> ${esc(L.prerequisites)}</div><div class="grid">${L.tutorial.map((c,i)=>`<article class="panel card"><div class="card-text"><p class="card-number">IDEA 0${i+1}</p><h3 style="margin:10px 0 12px">${esc(c.title)}</h3><p>${esc(c.body)}</p></div>${figure(c.svg,c.alt)}${formula(c.formula)}</article>`).join('')}</div><div class="applications">${L.applications.map(a=>`<article class="application"><p class="eyebrow">En la vida real</p><h3 style="margin-top:9px">${esc(a.title)}</h3><p>${esc(a.body)}</p></article>`).join('')}</div><div class="actions between"><p class="muted small">Ahora puedes mover las ideas y ver qué ocurre.</p><button class="primary" data-section="explore">Probar la simulación →</button></div></section>`;}
function explore(){const sim=L.simulation;return `<div class="section-head"><div><p class="eyebrow">02 · Laboratorio de ideas</p><h2>${esc(sim.title)}</h2></div><span class="tag">Tú tienes el control</span></div><p class="lead" style="margin-bottom:26px">${esc(sim.intro)}</p><section class="panel sim-layout"><div id="sim-figure"></div><div class="sim-controls"><div><div class="range-label"><label for="sim-range">${esc(sim.controlLabel)}</label><output id="sim-label" for="sim-range"></output></div><input id="sim-range" type="range" min="0" max="${sim.frames.length-1}" value="${frame}" step="1"><button id="play" class="secondary small">Reproducir cambios ▶</button></div><div class="metrics" id="sim-metrics"></div><p id="sim-description" class="small" aria-live="polite"></p><div class="sim-question"><strong>Observa y piensa</strong><p>${esc(sim.question)}</p></div></div></section><div class="actions between"><button class="plain" data-section="discover">← Volver a las ideas</button><button class="primary" data-section="train">Practicar con compañía →</button></div>`;}
function updateFrame(){const f=L.simulation.frames[frame];$('sim-figure').innerHTML=figure(f.svg,f.alt,'sim-graphic');$('sim-label').textContent=f.label;$('sim-range').value=frame;$('sim-range').setAttribute('aria-valuetext',f.label);$('sim-metrics').innerHTML=f.metrics.map(m=>`<div class="metric"><strong>${esc(m.value)}</strong><span>${esc(m.label)}</span></div>`).join('');$('sim-description').textContent=f.description;}
function optionsMarkup(q,choice,name,disabled=false){return `<fieldset class="options"><legend class="sr-only">Elige una respuesta</legend>${q.options.map((o,i)=>`<label class="option ${choice===i?'selected':''}"><input type="radio" name="${name}" value="${i}" id="${name}-${i}" ${choice===i?'checked':''} ${disabled?'disabled':''}><span class="letter" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></label>`).join('')}</fieldset>`;}
function guideMarkup(mode,index){const item=mode==='train'?L.training[index]:L.exercises[index],g=mode==='train'?S.guides[index]:S.helpGuides[index],q=item.steps[g.step],choice=g.answers[g.step],reveal=!!g.reveals[g.step],last=g.step===item.steps.length-1;return `<div class="guide-header"><p class="eyebrow">${mode==='train'?'Ejemplo '+(index+1)+' de 3':'Ayuda · Ejercicio '+(index+1)}</p><h3 style="margin-top:8px">${esc(item.title)}</h3><p class="small">${esc(item.prompt)}</p></div><div class="step-dots" aria-hidden="true">${item.steps.map((_,i)=>`<span class="step-dot ${i<=g.step?'done':''}"></span>`).join('')}</div><p class="eyebrow">Paso ${g.step+1} de ${item.steps.length} · ${reveal?'El procedimiento':'Tu turno'}</p><h3 style="margin-top:10px">${esc(q.title)}</h3><p class="step-prompt">${esc(q.prompt)}</p>${optionsMarkup(q,choice,'guide-'+mode)}${choice!==undefined?`<div class="feedback ${choice===q.correct?'good':''}" role="status"><strong>${choice===q.correct?'Bien pensado.':'Exploremos esa idea.'}</strong><p>${esc(q.feedback[choice])}</p></div>`:''}${reveal?`<div class="solution"><h3>Veamos el porqué</h3><p>${esc(q.explanation)}</p>${formula(q.calculation)}</div>`:''}<div class="guide-actions"><button class="secondary" data-guide="prev" data-mode="${mode}" ${g.step===0&&!reveal?'disabled':''}>← Anterior</button>${!reveal?`<button class="plain small" data-guide="together" data-mode="${mode}">Ver juntos</button>`:''}<button class="primary" data-guide="next" data-mode="${mode}" ${choice===undefined&&!reveal?'disabled':''}>${!reveal?'Ver procedimiento →':last?(mode==='train'?'Terminar ejemplo ✓':'Volver al ejercicio →'):'Siguiente paso →'}</button></div>`;}
function train(){return `<div class="section-head"><div><p class="eyebrow">03 · Entrenamiento acompañado</p><h2>Lo hacemos paso a paso.</h2></div><span class="tag">${S.trained.filter(Boolean).length} de 3 ejemplos</span></div><p class="lead" style="margin-bottom:26px">Elige una respuesta y avanza con la flecha para descubrir el procedimiento. Si lo prefieres, pulsa «Ver juntos».</p><div class="training-layout"><aside class="training-menu" aria-label="Ejemplos guiados">${L.training.map((e,i)=>`<button class="training-item ${S.trainIndex===i?'active':''}" data-training="${i}" ${S.trainIndex===i?'aria-current="true"':''}><span>${S.trained[i]?'✓ COMPLETADO':'EJEMPLO 0'+(i+1)}</span>${esc(e.title)}</button>`).join('')}</aside><section class="panel" id="training-guide">${guideMarkup('train',S.trainIndex)}</section></div>${allTrained()?`<div class="note"><strong>Ya tienes una base para intentarlo.</strong> Puedes consultar la ayuda cuando quieras.</div><button class="primary" data-section="quiz">Comenzar los 10 ejercicios →</button>`:''}`;}
function currentGuide(mode){return mode==='train'?S.guides[S.trainIndex]:S.helpGuides[helpIndex];}
function refreshGuide(mode,focusId){save();if(mode==='train')render();else $('help-content').innerHTML=guideMarkup('help',helpIndex);if(focusId)$(focusId)?.focus();}
function guideAction(action,mode){const g=currentGuide(mode),item=mode==='train'?L.training[S.trainIndex]:L.exercises[helpIndex];if(action==='prev'){if(g.reveals[g.step])g.reveals[g.step]=false;else if(g.step>0){g.step--;g.reveals[g.step]=true;}}else if(action==='together'){g.reveals[g.step]=true;}else if(action==='next'){if(g.answers[g.step]===undefined&&!g.reveals[g.step])return;if(!g.reveals[g.step])g.reveals[g.step]=true;else if(g.step<item.steps.length-1)g.step++;else if(mode==='train'){S.trained[S.trainIndex]=true;const next=S.trained.findIndex(v=>!v);if(next>=0)S.trainIndex=next;announce(allTrained()?'Entrenamiento completado. Ya puedes practicar.':'Ejemplo completado. Vamos con el siguiente.');}else{closeHelp();return;}}refreshGuide(mode);const target=mode==='train'?$('training-guide'):$('help-content');target.setAttribute('tabindex','-1');target.focus();}
function quiz(){const i=S.quizIndex,q=L.exercises[i],r=S.records[i];return `<div class="section-head"><div><p class="eyebrow">04 · Tu espacio de práctica</p><h2>Una idea, un intento.</h2></div><span class="tag">Sin prisa. Con ayuda si la necesitas.</span></div><div class="progress-wrap"><div class="progress-label"><span>${evaluated()} de 10 ejercicios revisados</span><span>${Math.round(evaluated()*10)} %</span></div><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${evaluated()}" aria-label="Ejercicios evaluados"><div class="progress-bar" style="width:${evaluated()*10}%"></div></div></div><div class="quiz-layout"><section class="panel"><p class="eyebrow">Ejercicio ${i+1} de 10 · ${esc(q.concept)}</p><h3 class="quiz-title">${esc(q.title)}</h3><p class="quiz-prompt">${esc(q.prompt)}</p>${optionsMarkup(q,r.choice,'quiz',r.solved)}<div class="actions"><button class="primary" data-action="check" ${r.choice===null||r.choice===r.last||r.solved?'disabled':''}>Comprobar respuesta</button><button class="help" data-action="help">✦ Necesito una ayuda</button></div>${r.last!==null?`<div class="feedback ${r.solved?'good':''}" role="status"><strong>${r.solved?'¡Lo resolviste!':'Todavía podemos explorarlo.'}</strong><p>${esc(q.feedback[r.last])}</p>${!r.solved?'<p class="small">Puedes probar otra opción, pedir ayuda o continuar y volver después.</p>':''}</div>`:''}<div class="actions between"><button class="plain" data-question="${i-1}" ${i===0?'disabled':''}>← Anterior</button>${i<9?`<button class="secondary" data-question="${i+1}" ${r.first===null?'disabled':''}>Siguiente ejercicio →</button>`:`<button class="primary" data-action="results" ${evaluated()<10?'disabled':''}>Ver mi recorrido →</button>`}</div></section><aside class="quiz-side"><div class="panel"><h3>Tu recorrido</h3><div class="quiz-map" aria-label="Navegar ejercicios">${S.records.map((v,j)=>`<button data-question="${j}" class="${j===i?'current':''} ${v.first!==null?'checked':''} ${v.help?'assisted':''}" aria-label="Ejercicio ${j+1}${v.solved?', resuelto':v.first!==null?', revisado':', pendiente'}${v.help?', con apoyo':''}" ${j===i?'aria-current="true"':''} ${j>0&&S.records[j-1].first===null&&v.first===null?'disabled':''}>${j+1}</button>`).join('')}</div><p>Verde: revisado. Durazno: con apoyo. Siempre puedes volver.</p></div><div class="panel" style="background:var(--soft)"><p class="eyebrow">Una idea para llevar</p><p>${esc(L.takeaway)}</p></div>${evaluated()===10?'<button class="secondary" data-action="results">Ver mi recorrido →</button>':''}</aside></div>`;}
function check(){const r=S.records[S.quizIndex],q=L.exercises[S.quizIndex];if(r.choice===null||r.solved||r.choice===r.last)return;const correct=r.choice===q.correct;r.attempts++;if(r.first===null)r.first={correct,assisted:r.help};r.last=r.choice;r.solved=correct;save();render();announce((correct?'Lo resolviste. ':'Veamos otra posibilidad. ')+q.feedback[r.last]);document.querySelector('[data-action="help"]')?.focus();}
function openHelp(){helpIndex=S.quizIndex;const r=S.records[helpIndex];r.help=true;if(!r.solved)r.assisted=true;save();$('help-content').innerHTML=guideMarkup('help',helpIndex);$('help-dialog').showModal();}
function closeHelp(){if($('help-dialog').open)$('help-dialog').close();}
$('help-dialog').addEventListener('close',()=>{helpIndex=null;render();document.querySelector('[data-action="help"]')?.focus();});
function results(){const first=S.records.filter(r=>r.first?.correct&&!r.first.assisted).length,solved=S.records.filter(r=>r.solved).length,help=S.records.filter(r=>r.help).length;const reinforce=[...new Set(L.exercises.filter((q,i)=>!S.records[i].first?.correct||S.records[i].first?.assisted||!S.records[i].solved).map(q=>q.concept))];return `<section><p class="eyebrow">Tu recorrido de aprendizaje</p><h1 style="font-size:clamp(2.7rem,6vw,4.8rem);margin:16px 0 22px">Cada intento construye.</h1><p class="lead">Revisaste los diez ejercicios. ${solved===10?'Ya lograste resolverlos todos.':'Puedes volver a los que quedan por resolver, con toda la ayuda que necesites.'}</p><div class="result-grid"><div class="metric"><strong>${first} / 10</strong><span>Aciertos iniciales sin apoyo</span></div><div class="metric"><strong>${solved} / 10</strong><span>Resueltos en total, incluidos reintentos</span></div><div class="metric"><strong>${help} / 10</strong><span>Explorados con ayuda</span></div></div><div class="note"><strong>Tu siguiente pequeño paso.</strong> ${reinforce.length?'Repasa '+esc(reinforce.join(', '))+'. Elige un ejercicio de abajo y explica con tus palabras por qué funciona su respuesta.':'Prueba explicar el procedimiento con tus palabras y cambia un dato de un ejercicio para comprobar que lo comprendiste.'}</div><p class="small muted">Los reintentos no cambian el primer intento registrado. Pedir ayuda forma parte del aprendizaje.</p><div class="review-list">${L.exercises.map((q,i)=>{const r=S.records[i];return `<div class="review-row"><div><strong>${i+1}. ${esc(q.title)}</strong><p>${r.solved?(r.assisted?'Resuelto con apoyo':r.first.correct?'Resuelto al primer intento':'Resuelto después de practicar'):'Podemos seguir practicándolo'} · ${esc(q.concept)}</p></div><button class="secondary small" data-question="${i}">Repasar →</button></div>`;}).join('')}</div><div class="actions"><button class="plain" data-section="explore">Volver al laboratorio</button><button class="primary" data-section="train">Repetir entrenamiento</button></div></section>`;}
document.addEventListener('change',e=>{if(e.target.name==='quiz'){const r=S.records[S.quizIndex];if(!r.solved)r.choice=Number(e.target.value);save();render();$('quiz-'+r.choice)?.focus();}else if(e.target.name==='guide-train'||e.target.name==='guide-help'){const mode=e.target.name.endsWith('train')?'train':'help';currentGuide(mode).answers[currentGuide(mode).step]=Number(e.target.value);refreshGuide(mode,e.target.id);}});
document.addEventListener('input',e=>{if(e.target.id==='sim-range'){stop();frame=Number(e.target.value);updateFrame();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.section){navigate(b.dataset.section);return;}if(b.dataset.training!==undefined){S.trainIndex=Number(b.dataset.training);save();render();return;}if(b.dataset.guide){guideAction(b.dataset.guide,b.dataset.mode);return;}if(b.dataset.question!==undefined){const i=Number(b.dataset.question);if(i>=0&&i<10&&(i===0||S.records[i-1].first!==null||S.records[i].first!==null)){S.quizIndex=i;navigate('quiz');}return;}switch(b.dataset.action){case'start-discover':$('tutorial').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});$('tutorial').setAttribute('tabindex','-1');$('tutorial').focus({preventScroll:true});break;case'check':check();break;case'help':openHelp();break;case'results':if(evaluated()===10)navigate('results');break;}if(b.id==='close-help')closeHelp();if(b.id==='play'){if(timer!==null)stop();else{if(frame===L.simulation.frames.length-1)frame=0;updateFrame();b.textContent='Pausar cambios Ⅱ';timer=setInterval(()=>{if(frame>=L.simulation.frames.length-1){stop();return;}frame++;updateFrame();},matchMedia('(prefers-reduced-motion: reduce)').matches?1400:600);}}if(b.id==='reset'&&confirm('¿Quieres empezar esta lección de nuevo? Se borrará solo el progreso de este tema.')){stop();if($('help-dialog').open)$('help-dialog').close();S=fresh();frame=0;save();render();announce('Listo. Empezamos con calma.');}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
render();
</script>
</body>
